name: pet_spa
description: "Sistema de gestión para Spa de Mascotas - Premium App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero_banner.png
    - assets/images/grooming_scene.png
    - assets/images/pets_collage.png
    - assets/images/services_card.png
    - assets/images/login_bg.png
